name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint and unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  examples:
    name: ${{ matrix.project }} / ${{ matrix.browser }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [project-a, project-b]
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build the platform
        run: |
          npm ci
          npm run build

      # Examples are pinned to published tags, so point them at this checkout instead.
      - name: Install example against the local platform
        working-directory: examples/${{ matrix.project }}
        run: npm install --no-save ../..

      - name: Check the example runs the platform's pinned Playwright
        working-directory: examples/${{ matrix.project }}
        run: |
          expected=$(node -p "require('../../package.json').dependencies['@playwright/test']")
          actual=$(npx playwright --version | awk '{print $2}')
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Install Playwright browser
        working-directory: examples/${{ matrix.project }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run example tests
        working-directory: examples/${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.browser }}
          path: examples/${{ matrix.project }}/playwright-report/
          retention-days: 14
