name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and build the platform
        run: |
          npm ci
          npm run build

      # The example is pinned to a published tag, so point it at this checkout instead.
      - name: Install example project against the local platform
        working-directory: examples/project-a
        run: npm install --no-save ../..

      - name: Install Playwright browsers
        working-directory: examples/project-a
        run: npx playwright install --with-deps chromium

      - name: Run example tests
        working-directory: examples/project-a
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/project-a/playwright-report/
          retention-days: 14
