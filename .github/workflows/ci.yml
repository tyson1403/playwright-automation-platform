name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [project-a, project-b]
    name: build-and-test (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Lint
        run: npm ci && npm run lint

      - name: Install and build the platform
        run: |
          npm ci
          npm run build

      # Examples are pinned to published tags, so point them at this checkout instead.
      - name: Install example against the local platform
        working-directory: examples/${{ matrix.project }}
        run: npm install --no-save ../..

      - name: Check the example runs the platform's pinned Playwright
        working-directory: examples/${{ matrix.project }}
        run: |
          expected=$(node -p "require('../../package.json').dependencies['@playwright/test']")
          actual=$(npx playwright --version | awk '{print $2}')
          echo "expected=$expected actual=$actual"
          test "$expected" = "$actual"

      - name: Install Playwright browsers
        working-directory: examples/${{ matrix.project }}
        run: npx playwright install --with-deps chromium

      - name: Run example tests
        working-directory: examples/${{ matrix.project }}
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: examples/${{ matrix.project }}/playwright-report/
          retention-days: 14
